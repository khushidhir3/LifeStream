services:
  # 1. Express Backend Web Service
  - type: web
    name: lifestream-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # NOTE: SQLite on Render's free plan is wiped on every deploy/restart.
      # For real use, create a Render Postgres database, set DATABASE_URL to it,
      # and change provider to "postgresql" in prisma/schema.prisma.
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: lifestream-client
          property: host
      - key: SEED_ADMIN_EMAIL
        value: admin@lifestream.local
      - key: SEED_ADMIN_PASS
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_BLOOD_BANK_RESOURCE_ID
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: lifestream-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Send every path to index.html so /login, /dashboard etc. work on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lifestream-backend
          property: host
